# The name of our workflow
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
          target: [Ui, Skeleton]
    name: "Release ${{ matrix.target }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Use debug signing
        run: mkdir -p ~/.gradle && echo -e "icsopenvpnDebugSign=true\norg.gradle.jvmargs=-Xmx2048M" > ~/.gradle/gradle.properties
      - name: copy tunnelblick patches
        run: cp -r ./tunnelblick-patches/* ./main/src/main/cpp/openvpn
      - name: apply patches
        run: cd ./main/src/main/cpp/openvpn && git apply 02-tunnelblick-openvpn_xorpatch-a.diff && git apply 03-tunnelblick-openvpn_xorpatch-b.diff && git apply 04-tunnelblick-openvpn_xorpatch-c.diff && git apply 05-tunnelblick-openvpn_xorpatch-d.diff && git apply 06-tunnelblick-openvpn_xorpatch-e.diff
      - name: delete patch files
        run: find ./main/src/main/cpp/openvpn -name "*.diff" -type f -delete
      - name: Build the app
        run: ./gradlew assemble${{ matrix.target }}Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.target }}
          path: main/build/outputs
      - name: Release APK (Ui only)
        if: matrix.target == 'Ui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latency-v1
          name: "ics-openvpn-xor 延迟版 (Latency Build)"
          files: main/build/outputs/apk/ui/release/*.apk
